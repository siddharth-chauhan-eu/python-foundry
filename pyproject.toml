[project]
name = "python-learning"
version = "0.1.0"
description = "Python projects spanning foundational tooling and domain-focused data work"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1,<6.0.0",
    "matplotlib>=3.10.9,<4.0.0",
    "numpy>=2.4.6,<3.0.0",
    "pandas>=3.0.3,<4.0.0",
    "seaborn>=0.13.2,<1.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0,<8.0.0",
    "jupyterlab>=4.6.4,<5.0.0",
    "notebook>=7.6.3,<8.0.0",
]

[tool.uv]
package = false
