[project]
name = "python-foundry"
version = "0.1.0"
description = "Python projects with locked environments and documented sources"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1,<6.0.0",
    "matplotlib>=3.10.9,<4.0.0",
    "numpy>=2.4.6,<3.0.0",
    "pandas>=3.1.0,<4.0.0",
    "seaborn>=0.13.2,<1.0.0",
]

[dependency-groups]
docs = [
    "mdformat==1.0.0",
    "mdformat-gfm==1.0.0",
    "pymarkdownlnt==0.9.41",
]
dev = [
    { include-group = "docs" },
    "ipykernel>=7.2.0,<8.0.0",
    "jupyterlab>=4.6.4,<5.0.0",
    "notebook>=7.6.3,<8.0.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
# Ruff 0.17.1 default rule set; the target Python version comes from requires-python.
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.pymarkdown.plugins.md013]
# Line length is handled by mdformat (wrap = 100 in .mdformat.toml).
enabled = false
